<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমি সাজিন, শাড়ি নিতে চাই!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Noto+Serif+Bengali:wght@700;900&display=swap">
<style>
:root{--bg:#3a0a2a;--bg2:#5c1240;--ink:#fff6e0;--gold:#f2b83a;--rose:#ff5c8a;--card:#fff6e0;--cardink:#3a0a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a061e;--bg2:#4a0f34}}
:root[data-theme="dark"]{--bg:#2a061e;--bg2:#4a0f34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;
background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%) fixed;overflow-x:hidden}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals i{position:absolute;top:-8vh;font-style:normal;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 16px 60px}
h1{font-family:'Noto Serif Bengali',serif;font-weight:900;font-size:clamp(2rem,7vw,4.4rem);line-height:1.25;text-align:center;margin:10px 0 6px;
background:linear-gradient(90deg,var(--gold),#fff,var(--rose),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.sub{text-align:center;font-size:clamp(1rem,3vw,1.3rem);opacity:.9;margin:0 0 22px}
.tick{overflow:hidden;border-block:2px dashed var(--gold);padding:8px 0;margin:0 -16px 30px;white-space:nowrap}
.tick div{display:inline-block;animation:mq 22s linear infinite;font-weight:700;color:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);color:var(--cardink);padding:12px 12px 16px;border-radius:6px;box-shadow:0 14px 30px #0008;transition:transform .3s;cursor:pointer;animation:bob 4s ease-in-out infinite}
.card:nth-child(1){transform:rotate(-2.5deg)}.card:nth-child(2){transform:rotate(1.8deg);animation-delay:-1.3s}.card:nth-child(3){transform:rotate(-1.2deg);animation-delay:-2.6s}
@keyframes bob{50%{translate:0 -8px}}
.card:hover{transform:rotate(0) scale(1.05);z-index:2}
.pic{position:relative;border-radius:3px;overflow:hidden;aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.t,.b{position:absolute;left:6px;right:6px;text-align:center;font-family:'Noto Serif Bengali',serif;font-weight:900;font-size:clamp(1.05rem,4vw,1.4rem);line-height:1.3;color:#fff;
text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
.t{top:8px}.b{bottom:8px}
.cap{margin:10px 4px 0;text-align:center;font-weight:700}
.cta{display:block;margin:44px auto 0;border:0;border-radius:999px;padding:18px 34px;font:700 clamp(1.1rem,4vw,1.5rem) 'Hind Siliguri',sans-serif;color:var(--cardink);background:linear-gradient(135deg,var(--gold),#ffd97a);cursor:pointer;box-shadow:0 0 0 0 var(--gold);animation:pulse 1.8s infinite}
.cta:hover{transform:scale(1.07) rotate(-1deg)}.cta:active{transform:scale(.95)}
.cta:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{70%{box-shadow:0 0 0 22px #f2b83a00}100%{box-shadow:0 0 0 0 #f2b83a00}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 140px;background:var(--card);color:var(--cardink);padding:14px 22px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px #000a;transition:translate .4s cubic-bezier(.2,1.4,.4,1);z-index:9;text-align:center;max-width:90vw}
.toast.on{translate:-50% 0}
.cnt{text-align:center;margin-top:14px;opacity:.85}
.fx{position:fixed;pointer-events:none;z-index:8;font-size:26px;animation:pop 1.3s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="petals" id="petals" aria-hidden="true"></div>

<button class="cta" id="cta">আমি শাড়ি নিতে চাই</button>
<p class="cnt">এখন পর্যন্ত শাড়ির আবদার: <b id="n">0</b> বার</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
var msgs=["অর্ডার গ্রহণ করা হয়েছে, শাড়ি আসছে!","দোকানদার বললেন, পছন্দ দারুণ!","পাড়ে সোনালি জরির কাজ থাকবে তো?","এবার একটা মানানসই ব্লাউজ লাগবে!","সাজিনের শাড়ি এখন ট্রেন্ডিং!"];
var tk=document.getElementById('tk'),line="আমি সাজিন, শাড়ি নিতে চাই ✦ শাড়ি সবার জন্য ✦ ঐতিহ্যে আত্মবিশ্বাস ✦ ";
tk.textContent=line.repeat(8);
var P=document.getElementById('petals'),em=["🌸","🪷","✨","🌺"];
for(var i=0;i<16;i++){var s=document.createElement('i');s.textContent=em[i%4];s.style.left=Math.random()*100+'vw';s.style.fontSize=(14+Math.random()*18)+'px';s.style.animationDuration=(9+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*15)+'s';s.style.opacity=.7;P.appendChild(s)}
var n=0,toast=document.getElementById('toast'),tm;
function burst(x,y){for(var i=0;i<18;i++){var f=document.createElement('span');f.className='fx';f.textContent=["🎉","🌸","✨","🥻","💛"][i%5];f.style.left=x+'px';f.style.top=y+'px';var a=Math.random()*6.28,d=80+Math.random()*140;f.style.setProperty('--dx',Math.cos(a)*d+'px');f.style.setProperty('--dy',Math.sin(a)*d-60+'px');f.style.setProperty('--r',(Math.random()*360)+'deg');document.body.appendChild(f);setTimeout(function(el){el.remove()}.bind(null,f),1400)}}
function say(x,y){n++;document.getElementById('n').textContent=n;toast.textContent=msgs[n%msgs.length];toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on')},2400);burst(x,y)}
document.getElementById('cta').addEventListener('click',function(e){var r=e.currentTarget.getBoundingClientRect();say(r.left+r.width/2,r.top)});
document.querySelectorAll('.card').forEach(function(c){function go(e){var r=c.getBoundingClientRect();say(e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2)}c.addEventListener('click',go);c.addEventListener('keydown',function(e){if(e.key==='Enter')go(e)})});
</script>
